name: Wisdom Quote Short

on:
  workflow_dispatch:
  schedule:
    # 3 runs/day at times when Telugu Shorts audience is typically most active:
    # 02:30 UTC = 08:00 IST (morning commute/scroll)
    # 07:30 UTC = 13:00 IST (lunch break)
    # 14:30 UTC = 20:00 IST (evening prime time)
    - cron: '30 2 * * *'
    - cron: '30 7 * * *'
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: wisdom-quote-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install ffmpeg and Telugu font
        timeout-minutes: 3
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-extra fonts-noto-color-emoji

      - name: Verify ffmpeg, font and Chrome
        run: |
          ffmpeg -version
          test -f /usr/share/fonts/truetype/noto/NotoSansTelugu-SemiBold.ttf
          test -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
          command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: node --check wisdom_simple.js

      - name: Generate and upload (private, pending review)
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node wisdom_simple.js 2>&1 | tee /tmp/run.log

      - name: Commit debug log (orphan branch)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p /tmp/debugrepo && cd /tmp/debugrepo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan debug-log
          cp /tmp/run.log ./last-run.log || echo "no log" > ./last-run.log
          git add last-run.log
          git commit -q -m "debug log"
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push -q -f origin debug-log
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Post review link to job summary
        if: always()
        run: |
          if [ -f work/review.txt ]; then
            cat work/review.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-article.json
          git diff --staged --quiet || git commit -m "Update wisdom quote state [skip ci]"
          git push
